<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .confirmation-box {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .icon-success {
            font-size: 80px;
            color: #28a745;
        }

        .summary-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Professional Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="index.html">MyShop</a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Left Menu -->
            <ul class="navbar-nav me-auto ms-3">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="category.html">Categories</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>

            <!-- Search Bar -->
            <form class="d-flex me-3">
                <input class="form-control form-control-sm me-2"
                       type="search"
                       placeholder="Search products...">
                <button class="btn btn-outline-light btn-sm" type="submit">
                    Search
                </button>
            </form>

            <!-- Cart -->
            <a href="cart.html" class="nav-link text-white fs-5 position-relative">
                <i class="bi bi-cart"></i>
                <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                      id="cartCount">0</span>
            </a>

        </div>
    </div>
</nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9">

                <div class="confirmation-box">

                    <div class="text-center">
                        <i class="bi bi-check-circle-fill icon-success"></i>
                        <h2 class="mt-3 text-success">Order Confirmed!</h2>
                        <p class="text-muted">Thank you for shopping with us.</p>
                    </div>

                    <hr class="my-4">

                    <div id="orderDetails"></div>

                    <div class="summary-box mt-4">
                        <h5>Order Summary</h5>
                        <div id="productList"></div>
                        <hr>
                        <p>Subtotal: ₹<span id="subtotal"></span></p>
                        <p>GST (5%): ₹<span id="gst"></span></p>
                        <h5>Total Paid: ₹<span id="total"></span></h5>
                    </div>

                    <hr class="my-4">

                    <div class="text-center mt-3">
                        <a href="index.html" class="btn btn-primary">
                            <i class="bi bi-house"></i> Continue Shopping
                        </a>

                        <a href="products.html" class="btn btn-outline-secondary ms-2">
                            View More Products
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem("orders")) || [];

        if (orders.length === 0) {
            document.body.innerHTML = `
<div class="container text-center py-5">
<h3>No Order Found</h3>
<a href="products.html" class="btn btn-primary mt-3">
Start Shopping
</a>
</div>
`;
        }

        let lastOrder = orders[orders.length - 1];

        let orderID = "ORD" + Math.floor(100000 + Math.random() * 900000);

        // Estimated Delivery
        let deliveryDate = new Date();
        deliveryDate.setDate(deliveryDate.getDate() + 5);

        document.getElementById("orderDetails").innerHTML = `
<div class="row">
<div class="col-md-6">
<p><strong>Order ID:</strong> ${orderID}</p>
<p><strong>Customer:</strong> ${lastOrder.customer.name}</p>
<p><strong>Email:</strong> ${lastOrder.customer.email}</p>
</div>

<div class="col-md-6 text-md-end">
<p><strong>Status:</strong> <span class="badge bg-success">Confirmed</span></p>
<p><strong>Phone:</strong> ${lastOrder.customer.phone}</p>
<p><strong>Delivery:</strong> ${deliveryDate.toDateString()}</p>
</div>
</div>
`;

        let productHTML = "";
        lastOrder.cart.forEach(item => {
            productHTML += `
<p>${item.name} x ${item.quantity} 
= ₹${item.price * item.quantity}</p>
`;
        });

        document.getElementById("productList").innerHTML = productHTML;
        document.getElementById("subtotal").innerText = lastOrder.subtotal;
        document.getElementById("gst").innerText = lastOrder.gst;
        document.getElementById("total").innerText = lastOrder.total;

        // Update Cart Badge
        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById("cartCount").innerText = totalQty;
        }
        updateCartCount();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
