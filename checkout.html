<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .checkout-card {
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .summary-card {
            border-radius: 15px;
            background: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Professional Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="index.html">MyShop</a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Left Menu -->
            <ul class="navbar-nav me-auto ms-3">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="category.html">Categories</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

            <!-- Search -->
            <form class="d-flex me-3">
                <input class="form-control form-control-sm me-2"
                       type="search"
                       placeholder="Search products...">

                <button class="btn btn-outline-light btn-sm" type="submit">
                    Search
                </button>
            </form>

            <!-- Cart -->
            <a class="nav-link text-white fs-5 position-relative" href="cart.html">
                <i class="bi bi-cart"></i>
                <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                      id="cartCount">0</span>
            </a>

        </div>
    </div>
</nav>



    <div class="container py-5">
        <h2 class="mb-4 fw-bold">Checkout</h2>

        <div class="row g-4">

            <!-- Billing Form -->
            <div class="col-md-6">
                <div class="card checkout-card p-4">
                    <h5 class="mb-3">Billing Details</h5>

                    <form id="checkoutForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name">
                            <div class="error" id="nameError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                            <div class="error" id="emailError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" id="address">
                            <div class="error" id="addressError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone">
                            <div class="error" id="phoneError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select class="form-select" id="payment">
                                <option value="COD">Cash on Delivery</option>
                                <option value="UPI">UPI</option>
                                <option value="Card">Debit/Credit Card</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Place Order
                        </button>

                    </form>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-md-6">
                <div class="summary-card p-4">
                    <h5>Order Summary</h5>
                    <hr>

                    <div id="orderSummary"></div>

                    <p>Subtotal: ₹<span id="subtotal">0</span></p>
                    <p>GST (5%): ₹<span id="gst">0</span></p>
                    <h4>Total: ₹<span id="summaryTotal">0</span></h4>

                </div>
            </div>

        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let summaryDiv = document.getElementById("orderSummary");

        if (cart.length === 0) {
            alert("Your cart is empty!");
            window.location.href = "products.html";
        }

        let subtotal = 0;

        cart.forEach(item => {
            subtotal += item.price * item.quantity;
            summaryDiv.innerHTML += `
<p>${item.name} x ${item.quantity} 
= ₹${item.price * item.quantity}</p>
`;
        });

        let gst = Math.round(subtotal * 0.05);
        let total = subtotal + gst;

        document.getElementById("subtotal").innerText = subtotal;
        document.getElementById("gst").innerText = gst;
        document.getElementById("summaryTotal").innerText = total;

        document.getElementById("checkoutForm").addEventListener("submit", function (e) {
            e.preventDefault();

            document.querySelectorAll(".error").forEach(el => el.innerText = "");

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let address = document.getElementById("address").value.trim();
            let phone = document.getElementById("phone").value.trim();

            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            let valid = true;

            if (name === "") {
                document.getElementById("nameError").innerText = "Name required";
                valid = false;
            }

            if (!emailPattern.test(email)) {
                document.getElementById("emailError").innerText = "Valid email required";
                valid = false;
            }

            if (address === "") {
                document.getElementById("addressError").innerText = "Address required";
                valid = false;
            }

            if (phone.length < 10) {
                document.getElementById("phoneError").innerText = "Valid phone required";
                valid = false;
            }

            if (valid) {

                let orders = JSON.parse(localStorage.getItem("orders")) || [];

                orders.push({
                    customer: { name, email, address, phone },
                    cart,
                    subtotal,
                    gst,
                    total,
                    date: new Date().toLocaleString()
                });

                localStorage.setItem("orders", JSON.stringify(orders));
                localStorage.removeItem("cart");

                alert("Order Placed Successfully!");
                window.location.href = "order-confirmation.html";
            }
        });

        function updateCartCount() {
            let totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById("cartCount").innerText = totalQty;
        }
        updateCartCount();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
