<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .cart-card {
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .cart-img {
            height: 90px;
            width: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            padding: 0;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 0;
        }

        .empty-cart i {
            font-size: 70px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <!-- Professional Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="index.html">MyShop</a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Left Menu -->
            <ul class="navbar-nav me-auto ms-3">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="category.html">Categories</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

            <!-- Search Bar -->
            <form class="d-flex me-3">
                <input class="form-control form-control-sm me-2"
                       type="search"
                       placeholder="Search products...">

                <button class="btn btn-outline-light btn-sm" type="submit">
                    Search
                </button>
            </form>

            <!-- Cart -->
            <a class="nav-link text-white fs-5 position-relative active" href="cart.html">
                <i class="bi bi-cart"></i>
                <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                      id="cartCount">0</span>
            </a>

        </div>
    </div>
</nav>


    <div class="container py-5">
        <h2 class="mb-4 fw-bold">Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="row mt-4">
            <div class="col-md-6"></div>
            <div class="col-md-6">
                <div class="card cart-card p-4">
                    <h5>Order Summary</h5>
                    <hr>

                    <p>Subtotal: ₹<span id="subtotal">0</span></p>
                    <p>GST (5%): ₹<span id="gst">0</span></p>
                    <h4>Total: ₹<span id="totalAmount">0</span></h4>

                    <a href="checkout.html" class="btn btn-success w-100 mt-3">
                        Proceed to Checkout
                    </a>

                    <button class="btn btn-outline-danger w-100 mt-2" onclick="clearCart()">Clear Cart</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function displayCart() {
            let cartDiv = document.getElementById("cartItems");
            let subtotal = 0;
            cartDiv.innerHTML = "";

            if (cart.length === 0) {
                cartDiv.innerHTML = `
<div class="empty-cart">
<i class="bi bi-cart-x"></i>
<h4 class="mt-3">Your Cart is Empty</h4>
<a href="products.html" class="btn btn-primary mt-3">
Start Shopping
</a>
</div>
`;
                updateSummary(0);
                updateCartCount();
                return;
            }

            cart.forEach((item, index) => {
                subtotal += item.price * item.quantity;

                cartDiv.innerHTML += `
<div class="card cart-card mb-3 p-3">
<div class="row align-items-center">
<div class="col-md-2 col-4">
<img src="${item.image}" class="cart-img">
</div>

<div class="col-md-4 col-8">
<h6 class="fw-bold">${item.name}</h6>
<p class="text-muted mb-1">₹${item.price}</p>
</div>

<div class="col-md-3 col-6 mt-2 mt-md-0">
<button class="btn btn-outline-secondary qty-btn"
onclick="updateQty(${index},-1)">-</button>
<span class="mx-2">${item.quantity}</span>
<button class="btn btn-outline-secondary qty-btn"
onclick="updateQty(${index},1)">+</button>
</div>

<div class="col-md-3 col-6 text-end">
<h6>₹${item.price * item.quantity}</h6>
<button class="btn btn-sm btn-danger"
onclick="removeItem(${index})">
<i class="bi bi-trash"></i>
</button>
</div>
</div>
</div>
`;
            });

            updateSummary(subtotal);
            updateCartCount();
        }

        function updateSummary(subtotal) {
            let gst = Math.round(subtotal * 0.05);
            let total = subtotal + gst;

            document.getElementById("subtotal").innerText = subtotal;
            document.getElementById("gst").innerText = gst;
            document.getElementById("totalAmount").innerText = total;
        }

        function updateQty(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function clearCart() {
            if (confirm("Are you sure you want to clear cart?")) {
                cart = [];
                localStorage.setItem("cart", JSON.stringify(cart));
                displayCart();
            }
        }

        function updateCartCount() {
            let totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById("cartCount").innerText = totalQty;
        }

        displayCart();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
