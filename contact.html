<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .contact-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .contact-info {
            background: #212529;
            color: white;
            padding: 40px;
            border-radius: 20px;
        }

        .contact-info i {
            font-size: 22px;
            margin-right: 10px;
        }

        footer {
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <!-- Professional Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="index.html">MyShop</a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Menu Links -->
            <ul class="navbar-nav me-auto ms-3">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">Product</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="category.html">Category</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="contact.html">Contact Us</a>
                </li>

            </ul>

            <!-- Search -->
            <form class="d-flex me-3">
                <input class="form-control form-control-sm me-2" type="search" placeholder="Search products...">
                <button class="btn btn-outline-light btn-sm" type="submit">Search</button>
            </form>

            <!-- Cart -->
            <a href="cart.html" class="nav-link text-white fs-5 position-relative">
                <i class="bi bi-cart"></i>
                <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle"
                    id="cartCount">0</span>
            </a>

        </div>
    </div>
</nav>


    <div class="container py-5">
        <div class="row g-5">

            <!-- Contact Form -->
            <div class="col-md-7">
                <div class="contact-box">
                    <h3 class="mb-4">Send Us a Message</h3>

                    <div id="successAlert" class="alert alert-success d-none">
                        Message Sent Successfully!
                    </div>

                    <form id="contactForm">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="name">
                            <div class="error" id="nameError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                            <div class="error" id="emailError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone">
                            <div class="error" id="phoneError"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="4" id="message"></textarea>
                            <div class="error" id="messageError"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send"></i> Send Message
                        </button>

                    </form>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="col-md-5">
                <div class="contact-info h-100">
                    <h4 class="mb-4">Contact Information</h4>

                    <p><i class="bi bi-geo-alt-fill"></i> Meerut, Uttar Pradesh, India</p>
                    <p><i class="bi bi-envelope-fill"></i> support@myshop.com</p>
                    <p><i class="bi bi-telephone-fill"></i> +91 7037672006</p>
                    <p><i class="bi bi-clock-fill"></i> Mon - Sat: 9AM - 7PM</p>

                    <hr class="bg-light">

                    <h5>Follow Us</h5>
                    <i class="bi bi-facebook me-3"></i>
                    <i class="bi bi-instagram me-3"></i>
                    <i class="bi bi-twitter-x me-3"></i>
                    <i class="bi bi-youtube"></i>

                </div>
            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        © 2026 MyShop | All Rights Reserved
    </footer>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let valid = true;

            document.querySelectorAll(".error").forEach(el => el.innerText = "");

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let message = document.getElementById("message").value.trim();

            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (name === "") {
                document.getElementById("nameError").innerText = "Name is required";
                valid = false;
            }

            if (!emailPattern.test(email)) {
                document.getElementById("emailError").innerText = "Enter valid email";
                valid = false;
            }

            if (phone.length < 10) {
                document.getElementById("phoneError").innerText = "Enter valid phone number";
                valid = false;
            }

            if (message === "") {
                document.getElementById("messageError").innerText = "Message cannot be empty";
                valid = false;
            }

            if (valid) {
                document.getElementById("successAlert").classList.remove("d-none");
                this.reset();
            }
        });

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById("cartCount").innerText = totalQty;
        }
        updateCartCount();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
